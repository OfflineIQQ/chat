<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-janabi Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efee;--card:#fff;--text:#14201e;--muted:#5f7370;--accent:#0f766e;--accent-text:#fff;--other:#fff;--line:#d3dedc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#162220;--text:#e8f1ef;--muted:#8aa39f;--accent:#14a398;--accent-text:#04201d;--other:#1d2d2a;--line:#27403c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
textarea{resize:none}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
button:disabled{opacity:.6}
.primary{background:var(--accent);color:var(--accent-text)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
.box h1{margin:0 0 4px;font-size:26px}
.box p{margin:0 0 8px;color:var(--muted)}
.row{display:flex;gap:8px}.row button{flex:1}
#err{color:#d14343;min-height:20px;font-size:14px}
#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{min-width:0}
header b{font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small.on,#mStatus.on{color:#16a34a}
.hb{display:flex;gap:6px;flex-shrink:0}
.hb button{padding:8px 10px;font-size:14px}
#tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tab{flex:1;border-radius:0;background:transparent;color:var(--muted);padding:10px 4px;font-size:14px;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#panel{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;max-height:30%;overflow-y:auto}
#panel h2,#people h2,#groups h2{margin:0 0 8px;font-size:15px}
#people,#groups{flex:1;overflow-y:auto;padding:12px 16px}
#people h2,#groups h2{margin:14px 0 6px;color:var(--muted)}
#q{margin-bottom:4px}
#gnew{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);color:var(--text);border:1px solid var(--line);margin-bottom:6px;padding:10px 12px;border-radius:12px}
.it{min-width:0;flex:1}
.item small{display:block;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-text);border-radius:8px;padding:2px 8px}
.avw{position:relative;flex-shrink:0;display:flex}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:76px;height:76px;font-size:30px}
.dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.big~.dot{width:16px;height:16px}
.ban{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
#profile{flex:1;overflow-y:auto;padding:16px;display:grid;gap:8px;align-content:start}
#profile label{font-size:14px;color:var(--muted);margin-top:6px}
#profile h2{margin:16px 0 4px;font-size:16px}
.pfhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pfLvl{color:var(--muted);font-size:14px}
#pfMsg,#gMsg,#giMsg,#rdMsg,#cdMsg{min-height:20px;font-size:14px}
.ok{color:#15803d}.bad{color:#d14343}
.code{font-family:ui-monospace,monospace;direction:ltr;text-align:right;font-weight:700;letter-spacing:1px}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;color:var(--muted);text-align:center}
.line{display:flex;align-items:flex-end;gap:8px;max-width:90%}
.line.mine{align-self:flex-end;flex-direction:row-reverse}
.line:not(.mine){align-self:flex-start}
.line .av{width:32px;height:32px;font-size:14px}
.msg{padding:8px 12px;border-radius:14px;background:var(--other);border:1px solid var(--line);overflow-wrap:anywhere;min-width:0}
.line.mine .msg{background:var(--accent);color:var(--accent-text);border-color:transparent}
.msg .who{font-size:12px;font-weight:700;opacity:.85;margin-bottom:2px}
.msg .who span{font-weight:400;opacity:.8}
.msg .who .lvb{font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-text);border-radius:6px;padding:0 5px;margin-inline-start:4px;opacity:1}
.line.mine .who .lvb{background:var(--accent-text);color:var(--accent)}
.msg .who .lvb.max,.line.mine .who .lvb.max{background:#f59e0b;color:#1a1200}
.msg img{display:block;max-width:100%;max-height:280px;border-radius:10px;margin-top:4px}
.msg a{color:inherit;text-decoration:underline;display:block;margin-top:4px}
.bar{display:flex;gap:6px;margin-top:6px}
.mini{padding:4px 10px;font-size:12px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.85;border-radius:8px}
#chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--line);color:var(--muted);font-size:14px}
#chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#send{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#send button{white-space:nowrap}
#modal,#ginfo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;text-align:center;max-height:92%;overflow-y:auto}
.sheet .row,.sheet .lv,.mlist{width:100%}
.sheet>.ghost{width:100%}
.mlist{display:grid;text-align:right}
#mName,#giName{font-size:20px}
#mUser,#mStatus,#mCnt,#giDesc,#giType{color:var(--muted);font-size:14px}
#mBio{overflow-wrap:anywhere}
.bar2{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0}
.bar2 i{display:block;height:100%;background:var(--accent)}
.stats{display:flex;gap:28px}
.stats div{display:grid}
.stats span{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<section id="auth">
  <form class="box" id="authForm">
    <h1>Al-janabi Chat</h1>
    <p>سجّل دخولك أو أنشئ حساب جديد</p>
    <input id="name" type="text" placeholder="الاسم (للحساب الجديد فقط)" autocomplete="nickname" maxlength="30">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required>
    <div id="err"></div>
    <div class="row">
      <button type="submit" class="primary">دخول</button>
      <button type="button" class="ghost" id="signupBtn">حساب جديد</button>
    </div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <div class="ttl"><b id="title">المجموعات</b><small id="me"></small></div>
    <div class="hb">
      <button class="ghost hidden" id="back">رجوع</button>
      <button class="ghost hidden" id="gInfoBtn">معلومات</button>
      <button class="ghost hidden" id="adminBtn">لوحة التحكم</button>
      <button class="ghost" id="logout">خروج</button>
    </div>
  </header>
  <div id="tabs">
    <button class="tab on" id="tabPub">المجموعات</button>
    <button class="tab" id="tabPriv">الخاصة</button>
    <button class="tab" id="tabSaved">المحفوظة</button>
    <button class="tab" id="tabProf">حسابي</button>
  </div>
  <div id="panel" class="hidden">
    <h2>المحظورون</h2>
    <div id="banList"></div>
  </div>
  <div id="groups" class="hidden">
    <button type="button" class="primary" id="gNewBtn" style="width:100%">+ مجموعة جديدة</button>
    <div id="gnew" class="hidden">
      <input id="gName" type="text" placeholder="اسم المجموعة" maxlength="40" autocomplete="off">
      <input id="gDesc" type="text" placeholder="وصف قصير (اختياري)" maxlength="150" autocomplete="off">
      <select id="gType">
        <option value="public">عامة: أي شخص يكدر ينضم</option>
        <option value="private">خاصة: أنت فقط تضيف الأعضاء</option>
      </select>
      <div id="gMsg"></div>
      <div class="row">
        <button type="button" class="primary" id="gCreate">إنشاء</button>
        <button type="button" class="ghost" id="gCancel">إلغاء</button>
      </div>
    </div>
    <h2>مجموعاتي</h2>
    <div id="myGroups"></div>
    <h2>اكتشف مجموعات</h2>
    <div id="pubGroups"></div>
  </div>
  <div id="people" class="hidden">
    <input id="q" type="search" placeholder="ابحث بالاسم أو اسم المستخدم" autocomplete="off">
    <h2>المحادثات</h2>
    <div id="inboxList"></div>
    <h2>المستخدمون</h2>
    <div id="userList"></div>
  </div>
  <div id="profile" class="hidden">
    <div class="pfhead">
      <div id="pfAv"></div>
      <button type="button" class="ghost" id="pfPick">تغيير الصورة</button>
      <button type="button" class="ghost" id="pfDel">حذف الصورة</button>
    </div>
    <div id="pfLvl"></div>
    <input id="pfPhoto" type="file" accept="image/*" class="hidden">
    <label for="pfName">الاسم</label>
    <input id="pfName" type="text" maxlength="30" autocomplete="off">
    <label for="pfUser">اسم المستخدم (حروف إنجليزية صغيرة وأرقام و _ ، من 3 إلى 20)</label>
    <input id="pfUser" type="text" maxlength="20" dir="ltr" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label for="pfBio">نبذة عني</label>
    <textarea id="pfBio" rows="3" maxlength="150"></textarea>
    <div id="pfMsg"></div>
    <button type="button" class="primary" id="pfSave">حفظ</button>
    <button type="button" class="ghost" id="pfView">عرض ملفي كما يراه الآخرون</button>

    <h2>لديك كود مستويات؟</h2>
    <div class="row">
      <input id="rdCode" type="text" dir="ltr" placeholder="الصق الكود هنا" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button type="button" class="primary" id="rdBtn" style="flex:0 0 auto">تفعيل</button>
    </div>
    <div id="rdMsg"></div>

    <div id="adminTools" class="hidden">
      <h2>أدوات المدير</h2>
      <button type="button" class="primary" id="atMax" style="width:100%">اجعل مستواي الأقصى (999)</button>
      <label for="cdCode">إنشاء كود جديد</label>
      <input id="cdCode" type="text" dir="ltr" placeholder="الكود (اتركه فارغاً لكود عشوائي)" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <div class="row">
        <input id="cdLv" type="number" min="1" max="998" placeholder="عدد المستويات">
        <input id="cdUses" type="number" min="1" placeholder="مرات الاستخدام">
      </div>
      <button type="button" class="primary" id="cdCreate" style="width:100%">إنشاء الكود</button>
      <div id="cdMsg"></div>
      <div id="cdList"></div>
    </div>
  </div>
  <div id="list"></div>
  <div id="chip" class="hidden"><span id="chipName"></span><button type="button" class="mini" id="chipX">إلغاء</button></div>
  <form id="send">
    <button type="button" class="ghost" id="attach" aria-label="إرفاق صورة أو ملف">📎</button>
    <input id="file" type="file" class="hidden">
    <input id="text" type="text" placeholder="اكتب رسالتك" maxlength="1000" autocomplete="off">
    <button type="submit" class="primary">إرسال</button>
  </form>
</section>

<div id="ginfo" class="hidden">
  <div class="sheet">
    <b id="giName"></b>
    <div id="giDesc"></div>
    <div id="giType"></div>
    <div id="giAdd" class="row hidden">
      <input id="giUser" type="text" dir="ltr" placeholder="@username لإضافة عضو" autocapitalize="none" autocomplete="off" spellcheck="false">
      <button type="button" class="primary" id="giAddBtn" style="flex:0 0 auto">إضافة</button>
    </div>
    <div id="giMsg"></div>
    <div id="giMembers" class="mlist"></div>
    <button type="button" class="ghost" id="giLeave">مغادرة المجموعة</button>
    <button type="button" class="ghost" id="giDelete">حذف المجموعة</button>
    <button type="button" class="ghost" id="giClose">إغلاق</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="sheet">
    <div id="mAv"></div>
    <b id="mName"></b>
    <div id="mUser"></div>
    <div id="mStatus"></div>
    <div id="mBio"></div>
    <div class="lv">
      <b id="mLvl"></b>
      <div class="bar2"><i id="mBar"></i></div>
      <div id="mCnt"></div>
    </div>
    <div class="stats">
      <div><b id="mFers">0</b><span>متابِعون</span></div>
      <div><b id="mFing">0</b><span>يتابع</span></div>
    </div>
    <div class="row">
      <button type="button" class="primary" id="mFollow">متابعة</button>
      <button type="button" class="ghost" id="mMsg">مراسلة</button>
    </div>
    <button type="button" class="ghost" id="mClose">إغلاق</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, writeBatch,
  increment, arrayUnion, arrayRemove, query, where, orderBy, limit, onSnapshot,
  serverTimestamp, getCountFromServer }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDgK8NFwky9907pBmFAh9zmvxY0X1BMqMw",
  authDomain: "al-janabi-chat.firebaseapp.com",
  projectId: "al-janabi-chat",
  storageBucket: "al-janabi-chat.firebasestorage.app",
  messagingSenderId: "1008425731131",
  appId: "1:1008425731131:web:171a8c58f948348ac0c81e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const LV = 2000;
const MAXLV = 999;

const errors = {
  "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
  "auth/email-already-in-use": "هذا البريد مسجّل من قبل. استخدم زر الدخول.",
  "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",
  "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً وحاول مرة ثانية.",
  "auth/network-request-failed": "تحقق من اتصال الإنترنت."
};
const showError = (e) => { $("err").textContent = errors[e.code] || "حدث خطأ. حاول مرة ثانية."; };

let me = null, isAdmin = false, mode = "groups", peer = null, grp = null, pending = null;
let unsubMsgs = null, unsubBan = null, unsubUsers = null, unsubInbox = null, unsubPres = null;
let unsubMyG = null, unsubPubG = null, unsubGrp = null, unsubCodes = null, beatTimer = null;
let usersMap = {}, presenceMap = {}, myGroups = [], pubGroups = [];
let lastMsgSnap = null, lastOpts = null, lastInboxSnap = null, pfPhoto = "";
let modalUid = null, modalTok = 0, followState = false;

const myName = () => (me && me.displayName) || "مستخدم";
const chatIdWith = (uid) => [me.uid, uid].sort().join("_");
const gdoc = (d) => Object.assign({ id: d.id, members: [] }, d.data());
const lvlOf = (c, b) => Math.min(MAXLV, Math.floor((c || 0) / LV) + 1 + (b || 0));

function lvlInfo(u) {
  const c = (u && u.msgCount) || 0;
  const lv = lvlOf(c, u && u.bonus);
  const max = lv >= MAXLV;
  return { lv, max, cur: c % LV, pct: max ? 100 : (c % LV) / LV * 100 };
}

function note(id, text, ok) {
  const m = $(id);
  m.textContent = text;
  m.className = ok ? "ok" : "bad";
}

/* ---------- الحالة (متصل / آخر ظهور) ---------- */
function isOnline(uid) {
  const p = presenceMap[uid];
  return !!(p && p.on && Date.now() - p.t < 240000);
}

function seenText(uid) {
  if (isOnline(uid)) return "متصل الآن";
  const p = presenceMap[uid];
  if (!p || !p.t) return "غير متصل";
  const d = new Date(p.t), now = new Date();
  const tm = d.toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that) / 86400000);
  if (diff <= 0) return "آخر ظهور اليوم " + tm;
  if (diff === 1) return "آخر ظهور أمس " + tm;
  return "آخر ظهور " + d.toLocaleDateString("ar") + " " + tm;
}

function beat(on) {
  if (!me) return Promise.resolve();
  return setDoc(doc(db, "presence", me.uid), { t: serverTimestamp(), on }).catch(() => {});
}
function startBeat() {
  stopBeat();
  beat(document.visibilityState === "visible");
  beatTimer = setInterval(() => { if (document.visibilityState === "visible") beat(true); }, 120000);
}
function stopBeat() { if (beatTimer) { clearInterval(beatTimer); beatTimer = null; } }
document.addEventListener("visibilitychange", () => { if (me) beat(document.visibilityState === "visible"); });
window.addEventListener("pagehide", () => { if (me) beat(false); });

function updateSub() {
  if (!me) return;
  const s = $("me");
  s.className = "";
  if (mode === "dm" && peer) {
    s.textContent = seenText(peer.uid);
    if (isOnline(peer.uid)) s.className = "on";
  } else if (mode === "group" && grp) {
    s.textContent = grp.members.length + " عضو" + (grp.type === "private" ? " - مجموعة خاصة" : "");
  } else {
    s.textContent = (me.displayName || me.email) + (isAdmin ? " (مدير)" : "");
  }
}

function refreshPresenceUI() {
  if (!me) return;
  if (mode === "people") { renderUserList(); if (lastInboxSnap) renderInbox(lastInboxSnap); }
  updateSub();
  if (modalUid && !$("modal").classList.contains("hidden")) drawModalStatus();
}
setInterval(refreshPresenceUI, 60000);

/* ---------- الدخول ---------- */
$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (err) { showError(err); }
});

$("signupBtn").addEventListener("click", async () => {
  $("err").textContent = "";
  const name = $("name").value.trim();
  if (!name) { $("err").textContent = "اكتب اسمك أول."; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, "users", cred.user.uid), { name }, { merge: true });
  } catch (err) { showError(err); }
});

$("logout").addEventListener("click", async () => { await beat(false); signOut(auth); });
$("adminBtn").addEventListener("click", () => $("panel").classList.toggle("hidden"));

function emptyNote(box, text) {
  const d = document.createElement("div");
  d.className = "empty";
  d.textContent = text;
  box.appendChild(d);
}

/* ---------- المرفقات ---------- */
function clearPending() {
  pending = null;
  $("file").value = "";
  $("chip").classList.add("hidden");
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 900, q = 0.7, out = "";
      for (let i = 0; i < 4; i++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 500000) break;
        max *= 0.75;
        q -= 0.1;
      }
      URL.revokeObjectURL(url);
      out.length < 750000 ? resolve(out) : reject(new Error("big"));
    };
    img.onerror = () => reject(new Error("bad"));
    img.src = url;
  });
}

function makeAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => reject(new Error("bad"));
    img.src = url;
  });
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("read"));
    r.readAsDataURL(file);
  });
}

$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  try {
    if (f.type.startsWith("image/")) {
      pending = { image: await compressImage(f), name: f.name };
    } else {
      if (f.size > 500 * 1024) { alert("حجم الملف أكبر من 500 كيلوبايت."); clearPending(); return; }
      pending = { data: await readAsDataUrl(f), name: f.name.slice(0, 100) };
    }
    $("chipName").textContent = (pending.image ? "📷 " : "📎 ") + f.name;
    $("chip").classList.remove("hidden");
  } catch (err) {
    alert("تعذر تجهيز الملف. جرّب صورة أو ملف أصغر.");
    clearPending();
  }
});

async function openProfile(uid) {
  if (!me) return;
  modalUid = uid;
  const tok = ++modalTok;
  const u = usersMap[uid] || {};
  const self = uid === me.uid;
  const li = lvlInfo(u);
  $("modal").classList.remove("hidden");
  $("mName").textContent = u.name || "مستخدم";
  $("mUser").textContent = u.username ? "@" + u.username : "";
  $("mBio").textContent = u.bio || "";
  $("mLvl").textContent = li.max ? "المستوى " + MAXLV + " (الأقصى) 🏆" : "المستوى " + li.lv;
  $("mBar").style.width = li.pct + "%";
  $("mCnt").textContent = li.max ? "وصل للحد الأقصى" : li.cur + " / " + LV + " رسالة للمستوى التالي";
  $("mFers").textContent = "…";
  $("mFing").textContent = "…";
  $("mFollow").classList.toggle("hidden", self);
  $("mMsg").classList.toggle("hidden", self);
  $("mFollow").disabled = true;
  followState = false;
  drawFollow();
  drawModalStatus();
  try {
    const [a, b] = await Promise.all([
      getCountFromServer(query(collection(db, "follows"), where("to", "==", uid))),
      getCountFromServer(query(collection(db, "follows"), where("from", "==", uid)))
    ]);
    if (tok !== modalTok) return;
    $("mFers").textContent = a.data().count;
    $("mFing").textContent = b.data().count;
    if (!self) {
      const s = await getDoc(doc(db, "follows", me.uid + "_" + uid));
      if (tok !== modalTok) return;
      followState = s.exists();
      drawFollow();
      $("mFollow").disabled = false;
    }
  } catch (e) {
    console.error(e);
    if (tok === modalTok) { $("mFers").textContent = "-"; $("mFing").textContent = "-"; }
  }
}

  if (!modalUid || modalUid === me.uid) return;
  const ref = doc(db, "follows", me.uid + "_" + modalUid);
  $("mFollow").disabled = true;
  try {
    const n = +$("mFers").textContent || 0;
    if (followState) {
      await deleteDoc(ref);
      followState = false;
      $("mFers").textContent = Math.max(0, n - 1);
    } else {
      await setDoc(ref, { from: me.uid, to: modalUid, at: serverTimestamp() });
      followState = true;
      $("mFers").textContent = n + 1;
    }
    drawFollow();
  } catch (e) {
    console.error(e);
    alert("تعذر تنفيذ العملية.");
  }
  $("mFollow").disabled = false;
});

$("pfSave").addEventListener("click", async () => {
  const name = $("pfName").value.trim();
  const uname = $("pfUser").value.trim().toLowerCase().replace(/^@/, "");
  const bio = $("pfBio").value.trim();
  if (!name) { note("pfMsg", "اكتب اسمك.", false); return; }
  if (uname && !/^[a-z0-9_]{3,20}$/.test(uname)) {
    note("pfMsg", "اسم المستخدم: حروف إنجليزية صغيرة وأرقام و _ فقط، من 3 إلى 20.", false);
    return;
  }
  if (["admin", "administrator", "support", "root"].includes(uname)) {
    note("pfMsg", "هذا الاسم محجوز للنظام.", false);
    return;
  }
  $("pfSave").disabled = true;
  note("pfMsg", "جارٍ الحفظ...", true);
  try {
    const old = (usersMap[me.uid] || {}).username || "";
    const batch = writeBatch(db);
    if (uname !== old) {
      if (uname) {
        const s = await getDoc(doc(db, "usernames", uname));
        if (s.exists() && s.data().uid !== me.uid) {
          note("pfMsg", "اسم المستخدم محجوز. اختر اسماً ثانياً.", false);
          $("pfSave").disabled = false;
          return;
        }
        if (!s.exists()) batch.set(doc(db, "usernames", uname), { uid: me.uid });
      }
      if (old) batch.delete(doc(db, "usernames", old));
    }
    batch.set(doc(db, "users", me.uid), { name, username: uname, bio, photo: pfPhoto }, { merge: true });
    await batch.commit();
    await updateProfile(me, { displayName: name });
    updateSub();
    note("pfMsg", "تم الحفظ.", true);
  } catch (e) {
    console.error(e);
    note("pfMsg", "تعذر الحفظ. قد يكون اسم المستخدم محجوزاً، أو لم تنشر القواعد الجديدة.", false);
  }
  $("pfSave").disabled = false;
});

$("rdBtn").addEventListener("click", async () => {
  const code = $("rdCode").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{4,20}$/.test(code)) { note("rdMsg", "الكود غير صحيح. تأكد من كتابته.", false); return; }
  if (lvlInfo(usersMap[me.uid] || {}).max) { note("rdMsg", "وصلت للمستوى الأقصى أصلاً.", false); return; }
  $("rdBtn").disabled = true;
  note("rdMsg", "جارٍ التحقق...", true);
  try {
    const cref = doc(db, "codes", code);
    const rref = doc(db, "redeems", code + "_" + me.uid);
    const [cs, rs] = await Promise.all([getDoc(cref), getDoc(rref)]);
    if (!cs.exists() || !cs.data().active) { note("rdMsg", "الكود غير صالح.", false); }
    else if (rs.exists()) { note("rdMsg", "استخدمت هذا الكود من قبل.", false); }
    else if (cs.data().uses >= cs.data().maxUses) { note("rdMsg", "هذا الكود انتهى (استُخدم بالكامل).", false); }
    else {
      const lv = cs.data().levels;
      const b = writeBatch(db);
      b.set(rref, { code, uid: me.uid, at: serverTimestamp() });
      b.update(cref, { uses: increment(1) });
      b.update(doc(db, "users", me.uid), { bonus: increment(lv), lastCode: code });
      await b.commit();
      $("rdCode").value = "";
      note("rdMsg", "تم التفعيل! حصلت على " + lv + " مستوى.", true);
    }
  } catch (e) {
    console.error(e);
    note("rdMsg", "تعذر تفعيل الكود. قد يكون استُخدم قبل لحظات أو انتهى.", false);
  }
  $("rdBtn").disabled = false;
});

function randCode() {
  const ch = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(8);
  crypto.getRandomValues(a);
  return Array.from(a, (n) => ch[n % ch.length]).join("");
}

function renderCodes(snap) {
  const box = $("cdList");
  box.textContent = "";
  if (snap.empty) { emptyNote(box, "لا توجد أكواد بعد."); return; }
  const rows = [];
  snap.forEach((d) => rows.push(Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" }))));
  const ts = (c) => (c.createdAt && c.createdAt.toMillis ? c.createdAt.toMillis() : 0);
  rows.sort((a, b) => ts(b) - ts(a));
  rows.forEach((c) => {
    const row = document.createElement("div");
    row.className = "ban";
    const info = document.createElement("div");
    info.style.minWidth = "0";
    const cd = document.createElement("div");
    cd.className = "code";
    cd.textContent = c.id;
    const sub = document.createElement("small");
    sub.style.cssText = "display:block;color:var(--muted)";
    sub.textContent = "+" + c.levels + " مستوى - استُخدم " + c.uses + " من " + c.maxUses;
    info.append(cd, sub);
    const act = document.createElement("div");
    act.style.cssText = "display:flex;gap:6px";
    const cp = miniBtn("نسخ", () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(c.id).then(() => { cp.textContent = "تم ✓"; }).catch(() => prompt("انسخ الكود:", c.id));
      } else { prompt("انسخ الكود:", c.id); }
    });
    const del = miniBtn("حذف", () => {
      if (confirm("حذف الكود " + c.id + "؟ (المستويات اللي انمنحت قبل ما تنسحب)")) deleteDoc(doc(db, "codes", c.id)).catch(console.error);
    });
    act.append(cp, del);
    row.append(info, act);
    box.appendChild(row);
  });
}

function setMode(m, p) {
  mode = m;
  peer = m === "dm" ? p : null;
  grp = m === "group" ? p : null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  if (unsubGrp) { unsubGrp(); unsubGrp = null; }
  lastMsgSnap = null;
  clearPending();
  closeGInfo();
  const chatLike = m === "public" || m === "dm" || m === "saved" || m === "group";
  $("tabPub").classList.toggle("on", m === "groups" || m === "group" || m === "public");
  $("tabPriv").classList.toggle("on", m === "people" || m === "dm");
  $("tabSaved").classList.toggle("on", m === "saved");
  $("tabProf").classList.toggle("on", m === "profile");
  $("groups").classList.toggle("hidden", m !== "groups");
  $("people").classList.toggle("hidden", m !== "people");
  $("profile").classList.toggle("hidden", m !== "profile");
  $("list").classList.toggle("hidden", !chatLike);
  $("send").classList.toggle("hidden", !chatLike);
  $("back").classList.toggle("hidden", !(m === "dm" || m === "group" || m === "public"));
  $("gInfoBtn").classList.toggle("hidden", m !== "group");
  $("adminBtn").classList.toggle("hidden", !(isAdmin && m === "public"));
  if (m !== "public") $("panel").classList.add("hidden");
  $("title").textContent = ({ groups: "المجموعات", public: "الدردشة العامة", people: "الرسائل الخاصة",
    saved: "الرسائل المحفوظة", profile: "حسابي" })[m] || (m === "group" ? grp.name : peer.name);
  $("text").disabled = false;
  $("list").textContent = "";
  if (m === "profile") fillProfile();

  let q = null;
  if (m === "public") {
    q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(50));
  } else if (m === "dm") {
    q = query(collection(db, "chats", chatIdWith(peer.uid), "messages"), orderBy("createdAt", "desc"), limit(50));
  } else if (m === "saved") {
    q = query(collection(db, "users", me.uid, "saved"), orderBy("createdAt", "desc"), limit(50));
  } else if (m === "group") {
    q = query(collection(db, "groups", grp.id, "messages"), orderBy("createdAt", "desc"), limit(50));
    unsubGrp = onSnapshot(doc(db, "groups", grp.id), (s) => {
      if (!s.exists()) { leftGroup(); return; }
      grp = gdoc(s);
      $("title").textContent = grp.name;
      updateSub();
      if (!$("ginfo").classList.contains("hidden")) drawGInfo();
      if (lastMsgSnap) renderMsgs(lastMsgSnap, curOpts());
    }, () => leftGroup());
  }
  if (q) unsubMsgs = onSnapshot(q, (snap) => renderMsgs(snap, curOpts()), (err) => { console.error(err); showDenied(); });
  updateSub();
}

$("tabSaved").addEventListener("click", () => setMode("saved"));
$("tabProf").addEventListener("click", () => setMode("profile"));
