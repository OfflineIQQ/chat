<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-janabi Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<section id="auth">
  <form class="box" id="authForm">
    <h1>Al-janabi Chat</h1>
    <p>سجّل دخولك أو أنشئ حساب جديد</p>
    <input id="name" type="text" placeholder="الاسم (للحساب الجديد فقط)" autocomplete="nickname" maxlength="30">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required>
    <div id="err"></div>
    <div class="row">
      <button type="submit" class="primary">دخول</button>
      <button type="button" class="ghost" id="signupBtn">حساب جديد</button>
    </div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <div class="ttl"><b id="title">المجموعات</b><small id="me"></small></div>
    <div class="hb">
      <button class="ghost hidden" id="back">رجوع</button>
      <button class="ghost hidden" id="gInfoBtn">معلومات</button>
      <button class="ghost hidden" id="adminBtn">لوحة التحكم</button>
      <button class="ghost" id="logout">خروج</button>
    </div>
  </header>
  <div id="tabs">
    <button class="tab on" id="tabPub">المجموعات</button>
    <button class="tab" id="tabPriv">الخاصة</button>
    <button class="tab" id="tabSaved">المحفوظة</button>
    <button class="tab" id="tabProf">حسابي</button>
  </div>
  <div id="panel" class="hidden">
    <h2>المحظورون</h2>
    <div id="banList"></div>
  </div>
  <div id="groups" class="hidden">
    <button type="button" class="primary" id="gNewBtn" style="width:100%">+ مجموعة جديدة</button>
    <div id="gnew" class="hidden">
      <input id="gName" type="text" placeholder="اسم المجموعة" maxlength="40" autocomplete="off">
      <input id="gDesc" type="text" placeholder="وصف قصير (اختياري)" maxlength="150" autocomplete="off">
      <select id="gType">
        <option value="public">عامة: أي شخص يكدر ينضم</option>
        <option value="private">خاصة: أنت فقط تضيف الأعضاء</option>
      </select>
      <div id="gMsg"></div>
      <div class="row">
        <button type="button" class="primary" id="gCreate">إنشاء</button>
        <button type="button" class="ghost" id="gCancel">إلغاء</button>
      </div>
    </div>
    <h2>مجموعاتي</h2>
    <div id="myGroups"></div>
    <h2>اكتشف مجموعات</h2>
    <div id="pubGroups"></div>
  </div>
  <div id="people" class="hidden">
    <input id="q" type="search" placeholder="ابحث بالاسم أو اسم المستخدم" autocomplete="off">
    <h2>المحادثات</h2>
    <div id="inboxList"></div>
    <h2>المستخدمون</h2>
    <div id="userList"></div>
  </div>
  <div id="profile" class="hidden">
    <div class="pfhead">
      <div id="pfAv"></div>
      <button type="button" class="ghost" id="pfPick">تغيير الصورة</button>
      <button type="button" class="ghost" id="pfDel">حذف الصورة</button>
    </div>
    <div id="pfLvl"></div>
    <input id="pfPhoto" type="file" accept="image/*" class="hidden">
    <label for="pfName">الاسم</label>
    <input id="pfName" type="text" maxlength="30" autocomplete="off">
    <label for="pfUser">اسم المستخدم (حروف إنجليزية صغيرة وأرقام و _ ، من 3 إلى 20)</label>
    <input id="pfUser" type="text" maxlength="20" dir="ltr" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label for="pfBio">نبذة عني</label>
    <textarea id="pfBio" rows="3" maxlength="150"></textarea>
    <div id="pfMsg"></div>
    <button type="button" class="primary" id="pfSave">حفظ</button>
    <button type="button" class="ghost" id="pfView">عرض ملفي كما يراه الآخرون</button>

    <h2>لديك كود مستويات؟</h2>
    <div class="row">
      <input id="rdCode" type="text" dir="ltr" placeholder="الصق الكود هنا" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button type="button" class="primary" id="rdBtn" style="flex:0 0 auto">تفعيل</button>
    </div>
    <div id="rdMsg"></div>

    <div id="adminTools" class="hidden">
      <h2>أدوات المدير</h2>
      <button type="button" class="primary" id="atMax" style="width:100%">اجعل مستواي الأقصى (999)</button>
      <label for="cdCode">إنشاء كود جديد</label>
      <input id="cdCode" type="text" dir="ltr" placeholder="الكود (اتركه فارغاً لكود عشوائي)" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <div class="row">
        <input id="cdLv" type="number" min="1" max="998" placeholder="عدد المستويات">
        <input id="cdUses" type="number" min="1" placeholder="مرات الاستخدام">
      </div>
      <button type="button" class="primary" id="cdCreate" style="width:100%">إنشاء الكود</button>
      <div id="cdMsg"></div>
      <div id="cdList"></div>
    </div>
  </div>
  <div id="list"></div>
  <div id="chip" class="hidden"><span id="chipName"></span><button type="button" class="mini" id="chipX">إلغاء</button></div>
  <form id="send">
    <button type="button" class="ghost" id="attach" aria-label="إرفاق صورة أو ملف">📎</button>
    <input id="file" type="file" class="hidden">
    <input id="text" type="text" placeholder="اكتب رسالتك" maxlength="1000" autocomplete="off">
    <button type="submit" class="primary">إرسال</button>
  </form>
</section>

<div id="ginfo" class="hidden">
  <div class="sheet">
    <b id="giName"></b>
    <div id="giDesc"></div>
    <div id="giType"></div>
    <div id="giAdd" class="row hidden">
      <input id="giUser" type="text" dir="ltr" placeholder="@username لإضافة عضو" autocapitalize="none" autocomplete="off" spellcheck="false">
      <button type="button" class="primary" id="giAddBtn" style="flex:0 0 auto">إضافة</button>
    </div>
    <div id="giMsg"></div>
    <div id="giMembers" class="mlist"></div>
    <button type="button" class="ghost" id="giLeave">مغادرة المجموعة</button>
    <button type="button" class="ghost" id="giDelete">حذف المجموعة</button>
    <button type="button" class="ghost" id="giClose">إغلاق</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="sheet">
    <div id="mAv"></div>
    <b id="mName"></b>
    <div id="mUser"></div>
    <div id="mStatus"></div>
    <div id="mBio"></div>
    <div class="lv">
      <span id="mLvl" class="lvb big"></span>
      <div class="bar2"><i id="mBar"></i></div>
      <div id="mCnt"></div>
    </div>
    <div class="stats">
      <div><b id="mFers">0</b><span>متابِعون</span></div>
      <div><b id="mFing">0</b><span>يتابع</span></div>
    </div>
    <div class="row">
      <button type="button" class="primary" id="mFollow">متابعة</button>
      <button type="button" class="ghost" id="mMsg">مراسلة</button>
    </div>
    <button type="button" class="ghost" id="mClose">إغلاق</button>
  </div>
</div>

<script>
var s = document.createElement("script");
s.type = "module";
s.src = "app.js?t=" + Date.now();
document.body.appendChild(s);
</script>
</body>
  </html>
