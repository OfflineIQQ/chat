<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-janabi Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efee; --card:#ffffff; --text:#14201e; --muted:#5f7370;
  --accent:#0f766e; --accent-text:#ffffff; --other:#ffffff; --line:#d3dedc;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1514; --card:#162220; --text:#e8f1ef; --muted:#8aa39f;
    --accent:#14a398; --accent-text:#04201d; --other:#1d2d2a; --line:#27403c; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hidden{display:none!important}
button,input{font:inherit}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--text);font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.primary{background:var(--accent);color:var(--accent-text)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}

#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:24px;display:grid;gap:12px}
.box h1{margin:0 0 4px;font-size:26px}
.box p{margin:0 0 8px;color:var(--muted)}
.row{display:flex;gap:8px}.row button{flex:1}
#err{color:#d14343;min-height:20px;font-size:14px}

#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:18px}
header small{display:block;color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;color:var(--muted)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--other);
  border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-text);border-color:transparent}
.msg .who{font-size:12px;font-weight:700;opacity:.75;margin-bottom:2px}
#send{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#send button{white-space:nowrap}
</style>
</head>
<body>

<section id="auth">
  <form class="box" id="authForm">
    <h1>Al-janabi Chat</h1>
    <p>سجّل دخولك أو أنشئ حساب جديد</p>
    <input id="name" type="text" placeholder="الاسم (للحساب الجديد فقط)" autocomplete="nickname" maxlength="30">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required>
    <div id="err"></div>
    <div class="row">
      <button type="submit" class="primary" id="loginBtn">دخول</button>
      <button type="button" class="ghost" id="signupBtn">حساب جديد</button>
    </div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <div><b>الدردشة العامة</b><small id="me"></small></div>
    <button class="ghost" id="logout">خروج</button>
  </header>
  <div id="list"><div class="empty">لا توجد رسائل بعد. اكتب أول رسالة.</div></div>
  <form id="send">
    <input id="text" type="text" placeholder="اكتب رسالتك" maxlength="1000" autocomplete="off" required>
    <button type="submit" class="primary">إرسال</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit,
  onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDgK8NFwky9907pBmFAh9zmvxY0X1BMqMw",
  authDomain: "al-janabi-chat.firebaseapp.com",
  projectId: "al-janabi-chat",
  storageBucket: "al-janabi-chat.firebasestorage.app",
  messagingSenderId: "1008425731131",
  appId: "1:1008425731131:web:171a8c58f948348ac0c81e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

const errors = {
  "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
  "auth/email-already-in-use": "هذا البريد مسجّل من قبل. استخدم زر الدخول.",
  "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",
  "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً وحاول مرة ثانية.",
  "auth/network-request-failed": "تحقق من اتصال الإنترنت."
};
const showError = (e) => { $("err").textContent = errors[e.code] || "حدث خطأ. حاول مرة ثانية."; };

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (err) { showError(err); }
});

$("signupBtn").addEventListener("click", async () => {
  $("err").textContent = "";
  const name = $("name").value.trim();
  if (!name) { $("err").textContent = "اكتب اسمك أول."; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    await updateProfile(cred.user, { displayName: name });
    $("me").textContent = name;
  } catch (err) { showError(err); }
});

$("logout").addEventListener("click", () => signOut(auth));

let unsubscribe = null;
onAuthStateChanged(auth, (user) => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  $("auth").classList.toggle("hidden", !!user);
  $("chat").classList.toggle("hidden", !user);
  if (!user) return;
  $("me").textContent = user.displayName || user.email;

  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubscribe = onSnapshot(q, (snap) => {
    const list = $("list");
    list.textContent = "";
    if (snap.empty) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "لا توجد رسائل بعد. اكتب أول رسالة.";
      list.appendChild(d);
      return;
    }
    snap.docs.slice().reverse().forEach((doc) => {
      const m = doc.data({ serverTimestamps: "estimate" });
      const box = document.createElement("div");
      box.className = "msg" + (m.uid === user.uid ? " mine" : "");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = m.name || "مستخدم";
      const body = document.createElement("div");
      body.textContent = m.text;
      box.append(who, body);
      list.appendChild(box);
    });
    list.scrollTop = list.scrollHeight;
  }, (err) => console.error(err));
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = auth.currentUser;
  const text = $("text").value.trim();
  if (!user || !text) return;
  $("text").value = "";
  try {
    await addDoc(collection(db, "messages"), {
      uid: user.uid,
      name: user.displayName || "مستخدم",
      text,
      createdAt: serverTimestamp()
    });
  } catch (err) { console.error(err); }
});
</script>
</body>
</html>
