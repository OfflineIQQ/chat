<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-janabi Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efee;--card:#fff;--text:#14201e;--muted:#5f7370;--accent:#0f766e;--accent-text:#fff;--other:#fff;--line:#d3dedc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#162220;--text:#e8f1ef;--muted:#8aa39f;--accent:#14a398;--accent-text:#04201d;--other:#1d2d2a;--line:#27403c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hidden{display:none!important}
button,input,textarea{font:inherit}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
textarea{resize:none}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.primary{background:var(--accent);color:var(--accent-text)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
.box h1{margin:0 0 4px;font-size:26px}
.box p{margin:0 0 8px;color:var(--muted)}
.row{display:flex;gap:8px}.row button{flex:1}
#err{color:#d14343;min-height:20px;font-size:14px}
#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{min-width:0}
header b{font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{display:flex;gap:6px;flex-shrink:0}
.hb button{padding:8px 10px;font-size:14px}
#tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tab{flex:1;border-radius:0;background:transparent;color:var(--muted);padding:10px;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#panel{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;max-height:30%;overflow-y:auto}
#panel h2,#people h2{margin:0 0 8px;font-size:15px}
#people{flex:1;overflow-y:auto;padding:12px 16px}
#people h2{margin:14px 0 6px;color:var(--muted)}
#q{margin-bottom:4px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);color:var(--text);border:1px solid var(--line);margin-bottom:6px;padding:10px 12px;border-radius:12px}
.it{min-width:0;flex:1}
.item small{display:block;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:76px;height:76px;font-size:30px}
.ban{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#profile{flex:1;overflow-y:auto;padding:16px;display:grid;gap:8px;align-content:start}
#profile label{font-size:14px;color:var(--muted);margin-top:6px}
.pfhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pfMsg{min-height:20px;font-size:14px}
.ok{color:#15803d}.bad{color:#d14343}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;color:var(--muted);text-align:center}
.line{display:flex;align-items:flex-end;gap:8px;max-width:90%}
.line.mine{align-self:flex-end;flex-direction:row-reverse}
.line:not(.mine){align-self:flex-start}
.line .av{width:32px;height:32px;font-size:14px}
.msg{padding:8px 12px;border-radius:14px;background:var(--other);border:1px solid var(--line);overflow-wrap:anywhere;min-width:0}
.line.mine .msg{background:var(--accent);color:var(--accent-text);border-color:transparent}
.msg .who{font-size:12px;font-weight:700;opacity:.8;margin-bottom:2px}
.msg .who span{font-weight:400;opacity:.8}
.msg img{display:block;max-width:100%;max-height:280px;border-radius:10px;margin-top:4px}
.msg a{color:inherit;text-decoration:underline;display:block;margin-top:4px}
.bar{display:flex;gap:6px;margin-top:6px}
.mini{padding:4px 10px;font-size:12px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.85;border-radius:8px}
#chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--line);color:var(--muted);font-size:14px}
#chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#send{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#send button{white-space:nowrap}
</style>
</head>
<body>

<section id="auth">
  <form class="box" id="authForm">
    <h1>Al-janabi Chat</h1>
    <p>سجّل دخولك أو أنشئ حساب جديد</p>
    <input id="name" type="text" placeholder="الاسم (للحساب الجديد فقط)" autocomplete="nickname" maxlength="30">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required>
    <div id="err"></div>
    <div class="row">
      <button type="submit" class="primary">دخول</button>
      <button type="button" class="ghost" id="signupBtn">حساب جديد</button>
    </div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <div class="ttl"><b id="title">الدردشة العامة</b><small id="me"></small></div>
    <div class="hb">
      <button class="ghost hidden" id="back">رجوع</button>
      <button class="ghost hidden" id="adminBtn">لوحة التحكم</button>
      <button class="ghost" id="logout">خروج</button>
    </div>
  </header>
  <div id="tabs">
    <button class="tab on" id="tabPub">العامة</button>
    <button class="tab" id="tabPriv">الخاصة</button>
    <button class="tab" id="tabProf">حسابي</button>
  </div>
  <div id="panel" class="hidden">
    <h2>المحظورون</h2>
    <div id="banList"></div>
  </div>
  <div id="people" class="hidden">
    <input id="q" type="search" placeholder="ابحث بالاسم أو اسم المستخدم" autocomplete="off">
    <h2>المحادثات</h2>
    <div id="inboxList"></div>
    <h2>المستخدمون</h2>
    <div id="userList"></div>
  </div>
  <div id="profile" class="hidden">
    <div class="pfhead">
      <div id="pfAv"></div>
      <button type="button" class="ghost" id="pfPick">تغيير الصورة</button>
      <button type="button" class="ghost" id="pfDel">حذف الصورة</button>
    </div>
    <input id="pfPhoto" type="file" accept="image/*" class="hidden">
    <label for="pfName">الاسم</label>
    <input id="pfName" type="text" maxlength="30" autocomplete="off">
    <label for="pfUser">اسم المستخدم (حروف إنجليزية صغيرة وأرقام و _ ، من 3 إلى 20)</label>
    <input id="pfUser" type="text" maxlength="20" dir="ltr" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label for="pfBio">نبذة عني</label>
    <textarea id="pfBio" rows="3" maxlength="150"></textarea>
    <div id="pfMsg"></div>
    <button type="button" class="primary" id="pfSave">حفظ</button>
  </div>
  <div id="list"></div>
  <div id="chip" class="hidden"><span id="chipName"></span><button type="button" class="mini" id="chipX">إلغاء</button></div>
  <form id="send">
    <button type="button" class="ghost" id="attach" aria-label="إرفاق صورة أو ملف">📎</button>
    <input id="file" type="file" class="hidden">
    <input id="text" type="text" placeholder="اكتب رسالتك" maxlength="1000" autocomplete="off">
    <button type="submit" class="primary">إرسال</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, addDoc, writeBatch,
  query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDgK8NFwky9907pBmFAh9zmvxY0X1BMqMw",
  authDomain: "al-janabi-chat.firebaseapp.com",
  projectId: "al-janabi-chat",
  storageBucket: "al-janabi-chat.firebasestorage.app",
  messagingSenderId: "1008425731131",
  appId: "1:1008425731131:web:171a8c58f948348ac0c81e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

const errors = {
  "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
  "auth/email-already-in-use": "هذا البريد مسجّل من قبل. استخدم زر الدخول.",
  "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",
  "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً وحاول مرة ثانية.",
  "auth/network-request-failed": "تحقق من اتصال الإنترنت."
};
const showError = (e) => { $("err").textContent = errors[e.code] || "حدث خطأ. حاول مرة ثانية."; };

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (err) { showError(err); }
});

$("signupBtn").addEventListener("click", async () => {
  $("err").textContent = "";
  const name = $("name").value.trim();
  if (!name) { $("err").textContent = "اكتب اسمك أول."; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    await updateProfile(cred.user, { displayName: name });
    $("me").textContent = name;
    await setDoc(doc(db, "users", cred.user.uid), { name }, { merge: true });
  } catch (err) { showError(err); }
});

$("logout").addEventListener("click", () => signOut(auth));
$("adminBtn").addEventListener("click", () => $("panel").classList.toggle("hidden"));

let me = null, isAdmin = false, mode = "public", peer = null, pending = null;
let unsubMsgs = null, unsubBan = null, unsubUsers = null, unsubInbox = null;
let usersMap = {}, lastMsgSnap = null, lastTools = false, lastInboxSnap = null, pfPhoto = "";

const myName = () => (me && me.displayName) || "مستخدم";
const chatIdWith = (uid) => [me.uid, uid].sort().join("_");

function emptyNote(box, text) {
  const d = document.createElement("div");
  d.className = "empty";
  d.textContent = text;
  box.appendChild(d);
}

function avatarEl(photo, name, extra) {
  const d = document.createElement("div");
  d.className = "av" + (extra ? " " + extra : "");
  if (photo) {
    const i = document.createElement("img");
    i.src = photo;
    i.alt = "";
    d.appendChild(i);
  } else {
    d.textContent = ((name || "?").trim().charAt(0) || "?").toUpperCase();
  }
  return d;
}

function showDenied() {
  const list = $("list");
  list.textContent = "";
  emptyNote(list, "لا تملك صلاحية عرض الرسائل. قد يكون حسابك محظوراً.");
  $("text").disabled = true;
}

/* ---------- المرفقات ---------- */
function clearPending() {
  pending = null;
  $("file").value = "";
  $("chip").classList.add("hidden");
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 900, q = 0.7, out = "";
      for (let i = 0; i < 4; i++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 500000) break;
        max *= 0.75;
        q -= 0.1;
      }
      URL.revokeObjectURL(url);
      out.length < 750000 ? resolve(out) : reject(new Error("big"));
    };
    img.onerror = () => reject(new Error("bad"));
    img.src = url;
  });
}

function makeAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => reject(new Error("bad"));
    img.src = url;
  });
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("read"));
    r.readAsDataURL(file);
  });
}

$("attach").addEventListener("click", () => $("file").click());
$("chipX").addEventListener("click", clearPending);

$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  try {
    if (f.type.startsWith("image/")) {
      pending = { image: await compressImage(f), name: f.name };
    } else {
      if (f.size > 500 * 1024) { alert("حجم الملف أكبر من 500 كيلوبايت."); clearPending(); return; }
      pending = { data: await readAsDataUrl(f), name: f.name.slice(0, 100) };
    }
    $("chipName").textContent = (pending.image ? "📷 " : "📎 ") + f.name;
    $("chip").classList.remove("hidden");
  } catch (err) {
    alert("تعذر تجهيز الملف. جرّب صورة أو ملف أصغر.");
    clearPending();
  }
});

/* ---------- عرض الرسائل ---------- */
function renderMsgs(snap, tools) {
  lastMsgSnap = snap;
  lastTools = tools;
  const list = $("list");
  list.textContent = "";
  if (snap.empty) { emptyNote(list, "لا توجد رسائل بعد. اكتب أول رسالة."); return; }
  snap.docs.slice().reverse().forEach((d) => {
    const m = d.data({ serverTimestamps: "estimate" });
    const u = usersMap[m.uid] || {};
    const line = document.createElement("div");
    line.className = "line" + (m.uid === me.uid ? " mine" : "");
    const box = document.createElement("div");
    box.className = "msg";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = u.name || m.name || "مستخدم";
    if (u.username) {
      const un = document.createElement("span");
      un.textContent = " @" + u.username;
      who.appendChild(un);
    }
    box.appendChild(who);
    if (m.text) {
      const body = document.createElement("div");
      body.textContent = m.text;
      box.appendChild(body);
    }
    if (m.image) {
      const im = document.createElement("img");
      im.src = m.image;
      im.alt = "صورة";
      box.appendChild(im);
    }
    if (m.fileData) {
      const a = document.createElement("a");
      a.href = m.fileData;
      a.download = m.fileName || "file";
      a.textContent = "📎 " + (m.fileName || "ملف");
      box.appendChild(a);
    }
    if (tools) {
      const bar = document.createElement("div");
      bar.className = "bar";
      const del = document.createElement("button");
      del.className = "mini";
      del.textContent = "حذف";
      del.onclick = () => {
        if (confirm("حذف هذه الرسالة؟")) deleteDoc(d.ref).catch(console.error);
      };
      bar.appendChild(del);
      if (m.uid !== me.uid) {
        const ban = document.createElement("button");
        ban.className = "mini";
        ban.textContent = "حظر";
        ban.onclick = () => {
          if (confirm("حظر " + (u.name || m.name || "هذا المستخدم") + "؟")) {
            setDoc(doc(db, "banned", m.uid), { name: u.name || m.name || "", at: serverTimestamp() })
              .catch(console.error);
          }
        };
        bar.appendChild(ban);
      }
      box.appendChild(bar);
    }
    line.append(avatarEl(u.photo, u.name || m.name), box);
    list.appendChild(line);
  });
  list.scrollTop = list.scrollHeight;
}

function renderBanned(snap) {
  const box = $("banList");
  box.textContent = "";
  if (snap.empty) { emptyNote(box, "لا يوجد محظورون."); return; }
  snap.forEach((d) => {
    const row = document.createElement("div");
    row.className = "ban";
    const n = document.createElement("span");
    n.textContent = d.data().name || d.id;
    const b = document.createElement("button");
    b.className = "mini";
    b.textContent = "إلغاء الحظر";
    b.onclick = () => deleteDoc(d.ref).catch(console.error);
    row.append(n, b);
    box.appendChild(row);
  });
}

function item(name, sub, photo, onClick) {
  const b = document.createElement("button");
  b.className = "item";
  const t = document.createElement("div");
  t.className = "it";
  const n = document.createElement("div");
  n.textContent = name;
  t.appendChild(n);
  if (sub) {
    const s = document.createElement("small");
    s.textContent = sub;
    t.appendChild(s);
  }
  b.append(avatarEl(photo, name), t);
  b.onclick = onClick;
  return b;
}

function renderUserList() {
  const box = $("userList");
  box.textContent = "";
  const term = $("q").value.trim().toLowerCase().replace(/^@/, "");
  const users = Object.keys(usersMap)
    .filter((id) => id !== me.uid)
    .map((id) => Object.assign({ uid: id }, usersMap[id]))
    .filter((u) => !term || (u.name || "").toLowerCase().includes(term) || (u.username || "").includes(term));
  if (!users.length) { emptyNote(box, term ? "لا توجد نتائج." : "لا يوجد مستخدمون آخرون بعد. ادعُ أصدقاءك للتسجيل."); return; }
  users.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  users.forEach((u) => {
    const sub = (u.username ? "@" + u.username : "") + (u.bio ? (u.username ? " - " : "") + u.bio : "");
    box.appendChild(item(u.name || "مستخدم", sub, u.photo, () => setMode("dm", { uid: u.uid, name: u.name || "مستخدم" })));
  });
}

function renderUsers(snap) {
  usersMap = {};
  snap.forEach((d) => { usersMap[d.id] = d.data(); });
  renderUserList();
  if (lastInboxSnap) renderInbox(lastInboxSnap);
  if (lastMsgSnap && (mode === "public" || mode === "dm")) renderMsgs(lastMsgSnap, lastTools);
}

function renderInbox(snap) {
  lastInboxSnap = snap;
  const box = $("inboxList");
  box.textContent = "";
  const rows = [];
  snap.forEach((d) => {
    const m = d.data({ serverTimestamps: "estimate" });
    const u = usersMap[d.id] || {};
    rows.push({ uid: d.id, name: u.name || m.name || "مستخدم", photo: u.photo, text: m.text || "",
      t: m.at && m.at.toMillis ? m.at.toMillis() : 0 });
  });
  if (!rows.length) { emptyNote(box, "لا توجد محادثات بعد. اختر مستخدماً من القائمة."); return; }
  rows.sort((a, b) => b.t - a.t);
  rows.forEach((r) => box.appendChild(item(r.name, r.text, r.photo, () => setMode("dm", { uid: r.uid, name: r.name }))));
}

$("q").addEventListener("input", renderUserList);

/* ---------- الملف الشخصي ---------- */
function drawPfAvatar() {
  const box = $("pfAv");
  box.textContent = "";
  box.appendChild(avatarEl(pfPhoto, $("pfName").value || myName(), "big"));
}

function fillProfile() {
  const u = usersMap[me.uid] || {};
  pfPhoto = u.photo || "";
  $("pfName").value = u.name || myName();
  $("pfUser").value = u.username || "";
  $("pfBio").value = u.bio || "";
  $("pfMsg").textContent = "";
  drawPfAvatar();
}

function pfNote(text, ok) {
  const m = $("pfMsg");
  m.textContent = text;
  m.className = ok ? "ok" : "bad";
}

$("pfPick").addEventListener("click", () => $("pfPhoto").click());
$("pfPhoto").addEventListener("change", async () => {
  const f = $("pfPhoto").files[0];
  if (!f) return;
  try { pfPhoto = await makeAvatar(f); drawPfAvatar(); pfNote("", true); }
  catch (e) { pfNote("تعذر قراءة الصورة. جرّب صورة ثانية.", false); }
  $("pfPhoto").value = "";
});
$("pfDel").addEventListener("click", () => { pfPhoto = ""; drawPfAvatar(); });

$("pfSave").addEventListener("click", async () => {
  const name = $("pfName").value.trim();
  const uname = $("pfUser").value.trim().toLowerCase().replace(/^@/, "");
  const bio = $("pfBio").value.trim();
  if (!name) { pfNote("اكتب اسمك.", false); return; }
  if (uname && !/^[a-z0-9_]{3,20}$/.test(uname)) {
    pfNote("اسم المستخدم: حروف إنجليزية صغيرة وأرقام و _ فقط، من 3 إلى 20.", false);
    return;
  }
  if (["admin", "administrator", "support", "root"].includes(uname)) {
    pfNote("هذا الاسم محجوز للنظام.", false);
    return;
  }
  $("pfSave").disabled = true;
  pfNote("جارٍ الحفظ...", true);
  try {
    const old = (usersMap[me.uid] || {}).username || "";
    const batch = writeBatch(db);
    if (uname !== old) {
      if (uname) {
        const s = await getDoc(doc(db, "usernames", uname));
        if (s.exists() && s.data().uid !== me.uid) {
          pfNote("اسم المستخدم محجوز. اختر اسماً ثانياً.", false);
          $("pfSave").disabled = false;
          return;
        }
        if (!s.exists()) batch.set(doc(db, "usernames", uname), { uid: me.uid });
      }
      if (old) batch.delete(doc(db, "usernames", old));
    }
    batch.set(doc(db, "users", me.uid), { name, username: uname, bio, photo: pfPhoto }, { merge: true });
    await batch.commit();
    await updateProfile(me, { displayName: name });
    $("me").textContent = name + (isAdmin ? " (مدير)" : "");
    pfNote("تم الحفظ.", true);
  } catch (e) {
    console.error(e);
    pfNote("تعذر الحفظ. قد يكون اسم المستخدم محجوزاً، أو لم تنشر القواعد الجديدة.", false);
  }
  $("pfSave").disabled = false;
});

/* ---------- التنقل ---------- */
function setMode(m, p) {
  mode = m;
  peer = p || null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  lastMsgSnap = null;
  clearPending();
  const chatLike = m === "public" || m === "dm";
  $("tabPub").classList.toggle("on", m === "public");
  $("tabPriv").classList.toggle("on", m === "people" || m === "dm");
  $("tabProf").classList.toggle("on", m === "profile");
  $("people").classList.toggle("hidden", m !== "people");
  $("profile").classList.toggle("hidden", m !== "profile");
  $("list").classList.toggle("hidden", !chatLike);
  $("send").classList.toggle("hidden", !chatLike);
  $("back").classList.toggle("hidden", m !== "dm");
  $("adminBtn").classList.toggle("hidden", !(isAdmin && m === "public"));
  if (m !== "public") $("panel").classList.add("hidden");
  $("title").textContent = m === "public" ? "الدردشة العامة"
    : m === "dm" ? peer.name : m === "profile" ? "حسابي" : "الرسائل الخاصة";
  $("text").disabled = false;
  $("list").textContent = "";

  if (m === "profile") fillProfile();
  if (m === "public") {
    const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(50));
    unsubMsgs = onSnapshot(q, (snap) => renderMsgs(snap, isAdmin), (err) => { console.error(err); showDenied(); });
  } else if (m === "dm") {
    const q = query(collection(db, "chats", chatIdWith(peer.uid), "messages"), orderBy("createdAt", "desc"), limit(50));
    unsubMsgs = onSnapshot(q, (snap) => renderMsgs(snap, false), (err) => { console.error(err); showDenied(); });
  }
}

$("tabPub").addEventListener("click", () => setMode("public"));
$("tabPriv").addEventListener("click", () => setMode("people"));
$("tabProf").addEventListener("click", () => setMode("profile"));
$("back").addEventListener("click", () => setMode("people"));

function stopAll() {
  [unsubMsgs, unsubBan, unsubUsers, unsubInbox].forEach((u) => { if (u) u(); });
  unsubMsgs = unsubBan = unsubUsers = unsubInbox = null;
  usersMap = {};
  lastMsgSnap = lastInboxSnap = null;
}

onAuthStateChanged(auth, async (user) => {
  stopAll();
  me = user;
  isAdmin = false;
  clearPending();
  $("auth").classList.toggle("hidden", !!user);
  $("chat").classList.toggle("hidden", !user);
  $("panel").classList.add("hidden");
  if (!user) return;
  $("me").textContent = user.displayName || user.email;

  try { isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists(); } catch (e) {}
  if (auth.currentUser !== user) return;

  try {
    const ref = doc(db, "users", user.uid);
    if (user.displayName) {
      await setDoc(ref, { name: user.displayName }, { merge: true });
    } else if (!(await getDoc(ref)).exists()) {
      await setDoc(ref, { name: (user.email || "").split("@")[0] || "مستخدم" }, { merge: true });
    }
  } catch (e) { console.error(e); }
  if (auth.currentUser !== user) return;

  if (isAdmin) {
    $("me").textContent = (user.displayName || user.email) + " (مدير)";
    unsubBan = onSnapshot(collection(db, "banned"), renderBanned, console.error);
  }
  unsubUsers = onSnapshot(collection(db, "users"), renderUsers, console.error);
  unsubInbox = onSnapshot(collection(db, "users", user.uid, "inbox"), renderInbox, console.error);
  setMode("public");
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!me || (!text && !pending)) return;
  const msg = { uid: me.uid, name: myName(), text, createdAt: serverTimestamp() };
  let preview = text;
  if (pending) {
    if (pending.image) { msg.image = pending.image; preview = text || "📷 صورة"; }
    else { msg.fileName = pending.name; msg.fileData = pending.data; preview = text || "📎 " + pending.name; }
  }
  $("text").value = "";
  clearPending();
  try {
    if (mode === "public") {
      await addDoc(collection(db, "messages"), msg);
    } else if (mode === "dm" && peer) {
      await addDoc(collection(db, "chats", chatIdWith(peer.uid), "messages"), msg);
      await setDoc(doc(db, "users", peer.uid, "inbox", me.uid),
        { name: myName(), text: preview, at: serverTimestamp() });
      await setDoc(doc(db, "users", me.uid, "inbox", peer.uid),
        { name: peer.name, text: preview, at: serverTimestamp() });
    }
  } catch (err) {
    console.error(err);
    alert("تعذر الإرسال. تأكد من نشر القواعد الجديدة ومن حجم الملف.");
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
